name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Generate release signing keystore
        id: keystore
        run: |
          KEYSTORE_PASS=$(openssl rand -base64 18)
          echo "::add-mask::$KEYSTORE_PASS"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Zoya AI Assistant, OU=Mobile, O=Zoya, L=City, S=State, C=US"
          echo "storepass=$KEYSTORE_PASS" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.storepass }}
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.storepass }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zoya-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: zoya-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
